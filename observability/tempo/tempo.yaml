# Tempo single-binary configuration for the local observability stack.
#
# Tempo 3.x monolithic mode: distributors, live-store, query frontend and
# compactor run in one process; no Kafka is required (Kafka is a microservices
# mode requirement in Tempo 3). The collector sends OTLP/gRPC to tempo:4317.
#
# Tempo's metrics-generator derives span metrics and service graphs from traces
# and remote-writes them to Prometheus. That is what powers the trace latency /
# error panels and graph in Grafana.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: runcodes-local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Seven days of trace blocks. Tempo 3 moved block lifecycle to the backend
# scheduler/worker; these are the in-process defaults for monolithic mode. The
# backend and judge are chatty (every health probe is a trace), so a short
# retention keeps a development disk from filling up. Raise it for production and
# pair it with an object-store backend.
backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        block_retention: 168h
        compacted_block_retention: 1h

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]

usage_report:
  reporting_enabled: false
