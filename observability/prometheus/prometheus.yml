# Prometheus configuration for the local RunCodes observability stack.
#
# Metrics reach Prometheus from two directions:
#   * the OpenTelemetry Collector exposes everything the backend and judge emit
#     over OTLP on :8889 (scraped by the "otel-collector" job);
#   * infrastructure exporters (Postgres, Redis, node, blackbox) are scraped
#     directly.
#
# Tempo's metrics-generator also remote-writes span metrics and service-graph
# metrics to this Prometheus (the receiver is enabled with
# --web.enable-remote-write-receiver in docker-compose.observability.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Cluster identity only; the deployment environment already travels as the
  # deployment_environment_name label from the OTel resource.
  external_labels:
    cluster: runcodes-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OTLP metrics from the backend and judge, converted to Prometheus format by
  # the collector's prometheus exporter. service_name and the other resource
  # attributes are added as labels by the collector.
  - job_name: otel-collector
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own telemetry (queue depth, dropped spans, export errors).
  - job_name: otel-collector-internal
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Synthetic probes of the platform's own health endpoints. These also make
  # /readyz call the judge, so a backend->judge trace is produced regularly even
  # when nobody uses the API.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8443/healthz
          - http://backend:8443/readyz
          - http://judge:9000/healthz
          - http://judge:9000/readyz
          - http://frontend:80/
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/ready
          - http://loki:3100/ready
          - http://tempo:3200/ready
          - http://alertmanager:9093/-/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
