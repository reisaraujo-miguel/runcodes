# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # --- FRONTEND DEPENDENCIES ---
  - package-ecosystem: "bun"
    directory: "/frontend/"
    schedule:
      interval: "weekly"
    groups: # Group all npm updates together
      bun-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(frontend/deps)"
      prefix-development: "chore(frontend/dev-deps)"
    ignore: # Ignore major version updates for now
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- BACKEND AND JUDGE DEPENDENCIES ---
  - package-ecosystem: "gomod"
    directories: ["/backend/", "/judge/"]
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(go/deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- DOCKER IMAGES ---
  # Every Dockerfile the platform builds or ships: the database and judge images
  # are production artifacts too.
  - package-ecosystem: "docker"
    directories: ["/backend/", "/frontend/", "/database/", "/judge/"]
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(docker)"

  # --- DOCKER IMAGES (JUDGE RUNTIME) ---
  # The images a submission is actually graded in, and the monitor every one of
  # them copies its binary from. They pin third-party toolchains (python,
  # temurin, iverilog, ...), so a tag that stops moving here is an unpatched
  # toolchain running untrusted code.
  - package-ecosystem: "docker"
    directories:
      - "/monitor/"
      - "/judge-runners/base/"
      - "/judge-runners/c/"
      - "/judge-runners/c-omp/"
      - "/judge-runners/c-omp-mpi/"
      - "/judge-runners/cpp/"
      - "/judge-runners/cpp-omp/"
      - "/judge-runners/cpp-omp-mpi/"
      - "/judge-runners/dotnet/"
      - "/judge-runners/fortran/"
      - "/judge-runners/go/"
      - "/judge-runners/haskell/"
      - "/judge-runners/java/"
      - "/judge-runners/julia/"
      - "/judge-runners/lua/"
      - "/judge-runners/octave/"
      - "/judge-runners/pascal/"
      - "/judge-runners/portugol/"
      - "/judge-runners/prolog/"
      - "/judge-runners/python/"
      - "/judge-runners/r/"
      - "/judge-runners/rust/"
      - "/judge-runners/verilog/"
      - "/judge-runners/zig/"
    schedule:
      interval: "weekly"
    groups:
      docker-runners:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(docker/runners)"

  # --- GITHUB ACTIONS ---
  # The workflows build the images that gate merges, so a stale or moved action
  # tag is a supply-chain risk, not just outdated tooling.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(actions)"

  # --- DOCKER COMPOSE SCRIPTS ---
  # The compose file at the root is the only one; the backend used to carry a
  # second, per-service copy.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(docker-compose)"
