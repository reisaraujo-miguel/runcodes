name: Publish Runners

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: runners-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required to push the images to GHCR.
  packages: write

env:
  # Derived from the repository that runs the workflow. The upstream repository
  # publishes ghcr.io/runcodes-icmc/runcodes-runner-*; a fork publishes
  # ghcr.io/<owner>/<repo>-runner-*.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}-runner
  MONITOR_IMAGE: ghcr.io/${{ github.repository }}-monitor

jobs:
  # Reusable monitor build. The base image copies /usr/bin/monitor out of this
  # image, so it must exist before docker-build-base starts.
  monitor:
    name: Build & push monitor
    uses: ./.github/workflows/monitor.yml

  docker-build-base:
    name: Build & push base
    needs: monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # The language Dockerfiles derive from `:latest`; without it a
            # release would leave them building on the previous base.
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./runners/base
          push: true
          # The monitor job pushed :latest immediately before this job. Pull it
          # so a cached COPY --from cannot supply an older monitor binary.
          pull: true
          build-args: |
            MONITOR_IMAGE=${{ env.MONITOR_IMAGE }}:latest
          # Images are built for the judge's architecture only; the sources they
          # install (toolchains distributed as amd64 packages, for the most part)
          # are not all available for arm64.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runners-base
          cache-to: type=gha,mode=max,scope=runners-base

  docker-build-others:
    name: Build & push ${{ matrix.image }}
    # The language images are built on top of the base just pushed: all 22 pull
    # it, 12 as their own base image and 10 to copy `/usr/bin/runcodes` and
    # `/usr/bin/monitor` into a third-party base.
    needs: docker-build-base
    strategy:
      # One broken language must not hide the state of the other 21: this job
      # publishes what a graded run depends on, and a partial release is easier
      # to reason about from a full matrix than from the first failure.
      fail-fast: false
      matrix:
        # The languages the judge recognizes (`judge/internal/language`), one
        # image each. A new language needs an entry here, a directory next to
        # this file, and an entry in the database schema — nothing else.
        image:
          - c
          - cpp
          - c-omp
          - c-omp-mpi
          - cpp-omp
          - cpp-omp-mpi
          - dotnet
          - fortran
          - go
          - haskell
          - java
          - julia
          - lua
          - octave
          - pascal
          - portugol
          - prolog
          - python
          - r
          - rust
          - verilog
          - zig

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # What the judge pulls by default (`JUDGE_IMAGE_FORMAT`).
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./runners/${{ matrix.image }}
          push: true
          # Build against the base image this run just pushed, not an upstream
          # copy with a possibly older monitor.
          build-args: |
            RUNNER_BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:latest
          # Every referenced image (starting with the base pushed above, then
          # the language's own distribution base) is resolved at build time:
          # without this, a builder could reuse a base image cached from an
          # earlier run and publish an image with a stale monitor in it.
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runners-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=runners-${{ matrix.image }}
