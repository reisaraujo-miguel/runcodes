name: Publish Application Images

# The four application images are consumed by name by deploy/ansible.
# Publishing them here keeps the deployment hosts from needing a source build
# and a Go/Bun toolchain. The runner workflow calls monitor.yml and then builds
# the base and language images; see runners.yml.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required to push to GHCR.
  packages: write

env:
  # Derive the GHCR namespace from the repository that runs the workflow. The
  # upstream repository publishes ghcr.io/runcodes-icmc/runcodes-<service>; a
  # fork publishes ghcr.io/<owner>/<repo>-<service> and a deployment can point
  # its image variables there.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
            # Browser telemetry is build-time. These values make the image
            # work behind the deployment's same-origin Caddy route; the
            # collector URL is relative, so no environment-specific host is
            # baked into the SPA.
            build-args: |
              VITE_API_ENDPOINT=
              VITE_OTEL_ENABLED=true
              VITE_OTEL_EXPORTER_OTLP_ENDPOINT=/otel
              VITE_OTEL_SERVICE_NAME=runcodes-frontend
              VITE_OTEL_SERVICE_VERSION=ci
              VITE_DEPLOYMENT_ENVIRONMENT=production
              VITE_OTEL_TRACES_SAMPLER_ARG=1.0
          - service: database
            context: ./database
          - service: judge
            context: ./judge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            # The deployment's default tag. Keep it in step with the runner
            # release tag when doing a coordinated release.
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          push: true
          # The runner images are amd64; keep the application images on the
          # same architecture as the judge and the database host.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args || '' }}
          pull: true
          cache-from: type=gha,scope=app-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.service }}
