name: Validate Observability

on:
  pull_request:
    paths:
      - "observability/**"
      - "scripts/observability/**"
      - "backend/telemetry/**"
      - "judge/internal/telemetry/**"
      - "frontend/src/lib/telemetry/**"
      - "frontend/src/main.tsx"
      - "frontend/e2e/**"
      - "frontend/playwright.config.ts"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - "docker-compose.observability.yml"
      - "docker-compose.observability.build.yml"
      - "deploy/compose/docker-compose.yml"
      - "deploy/compose/deploy.sh"
      - "frontend/Caddyfile"
      - ".github/workflows/observability.yml"
  push:
    branches:
      - main
    paths:
      - "observability/**"
      - "scripts/observability/**"
      - "backend/telemetry/**"
      - "judge/internal/telemetry/**"
      - "frontend/src/lib/telemetry/**"
      - "frontend/src/main.tsx"
      - "frontend/e2e/**"
      - "frontend/playwright.config.ts"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - "docker-compose.observability.yml"
      - "docker-compose.observability.build.yml"
      - "deploy/compose/docker-compose.yml"
      - "deploy/compose/deploy.sh"
      - "frontend/Caddyfile"
      - ".github/workflows/observability.yml"
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate the frontend Caddyfile
        # The /otel route carries browser traces into the collector; a syntax
        # error there breaks the frontend image at startup.
        run: |
          docker run --rm \
            -e RUNCODES_DOMAIN=:80 \
            -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate compose, Prometheus, Alertmanager, collector and files
        # The script sets throwaway values for the application secrets that
        # Compose interpolates; no real secret is needed to validate config.
        run: ./scripts/observability/validate.sh
