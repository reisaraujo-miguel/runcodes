name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  judge:
    name: Judge (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge
    env:
      # Without these the podman bindings need gpgme/btrfs development headers.
      TAGS: >-
        remote containers_image_openpgp exclude_graphdriver_btrfs
        exclude_graphdriver_overlay exclude_graphdriver_devicemapper
        exclude_graphdriver_zfs btrfs_noversion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: judge/go.mod
          cache-dependency-path: judge/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -tags "$TAGS" ./...

      - name: Test
        # The end-to-end integration test skips itself unless JUDGE_TEST_DB_DSN
        # is set; see judge/integration/run.sh for the full harness.
        run: go test -count=1 -race -tags "$TAGS" ./...

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned to the version that generated bun.lock.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check SVGs are optimised
        run: bun run check-svg

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  monitor:
    name: Monitor & runners (C, shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The monitor is the only thing inside a graded container that produces
      # data the judge trusts, and the harness is what reads the judge's config
      # and enforces the limits. Both are tested against real child processes;
      # neither needs Docker.
      - name: Test the monitor
        run: ./monitor/test/monitor.test.sh

      - name: Test the image harness
        run: ./runners/test/harness.test.sh

  database:
    name: Database (schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
        env:
          POSTGRES_USER: runcodes
          POSTGRES_PASSWORD: runcodes
          POSTGRES_DB: runcodes
        ports:
          - 5432:5432
        # Fail the job fast if the server never becomes ready.
        options: >-
          --health-cmd "pg_isready -U runcodes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema and seed
        env:
          PGPASSWORD: runcodes
        run: |
          for file in 01-init.sql 02-schema.sql 03-seed-data.sql; do
            echo "::group::$file"
            psql -h localhost -U runcodes -d runcodes -v ON_ERROR_STOP=1 \
              -f "database/schema/$file"
            echo "::endgroup::"
          done

      # The services log in as this role, so a broken grant breaks every request
      # rather than only the database: create it the way the image's init step does.
      - name: Create the application role
        env:
          POSTGRES_USER: runcodes
          POSTGRES_DB: runcodes
          PGHOST: localhost
          PGPASSWORD: runcodes
          RUNCODES_DB_APP_PASSWORD: app-password
          RUNCODES_DB_JUDGE_PASSWORD: judge-password
        run: ./database/schema/05-app-role.sh

      # The role exists to bound what a SQL injection in a service can do, so the
      # point of it is what it cannot do. Assert both directions: without the
      # positive checks a role that cannot connect at all would pass.
      - name: Verify the application role's privileges
        env:
          PGHOST: localhost
          PGDATABASE: runcodes
          PGUSER: runcodes_app
          PGPASSWORD: app-password
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "BEGIN;
                  INSERT INTO users (name, email, password_hash)
                       VALUES ('ci-privilege-check', 'ci-privilege-check@invalid', '!');
                  DELETE FROM users WHERE email = 'ci-privilege-check@invalid';
                  ROLLBACK;"
          psql -v ON_ERROR_STOP=1 \
            -c "UPDATE commits SET status = status WHERE false"

          denied=0
          deny() {
            if psql -v ON_ERROR_STOP=1 -tAc "$1" >/dev/null 2>&1; then
              echo "::error::runcodes_app was allowed to run: $1"
              denied=1
            fi
          }
          deny "CREATE TABLE ci_privilege_check (i int)"
          deny "DROP TABLE commits"
          deny "ALTER TABLE commits ADD COLUMN ci_privilege_check int"
          deny "CREATE ROLE ci_privilege_check"
          deny "SELECT * FROM pg_authid"
          exit "${denied}"

      - name: Verify the judge role is confined to judging tables
        env:
          PGHOST: localhost
          PGDATABASE: runcodes
          PGUSER: runcodes_judge
          PGPASSWORD: judge-password
        run: |
          # Positive checks: the queue and the inputs the judge actually uses.
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM commits"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM exercises"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM exercises_test_cases"

          # No grant on users.
          if psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM users" >/dev/null 2>&1; then
            echo "::error::runcodes_judge can read users"
            exit 1
          fi

          # Even if a future grant is too broad, RLS has no policy for the judge
          # role and must return no rows. Seed a row as the owner so a broken
          # policy (which would return 1) cannot pass against an empty table.
          PGUSER=runcodes PGPASSWORD=runcodes psql -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (name, email, password_hash)
                     VALUES ('ci-rls-check', 'ci-rls-check@invalid', '!')"
          PGUSER=runcodes PGPASSWORD=runcodes psql -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT ON users TO runcodes_judge"
          count="$(psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM users")"
          PGUSER=runcodes PGPASSWORD=runcodes psql -v ON_ERROR_STOP=1 \
            -c "REVOKE SELECT ON users FROM runcodes_judge"
          PGUSER=runcodes PGPASSWORD=runcodes psql -v ON_ERROR_STOP=1 \
            -c "DELETE FROM users WHERE email = 'ci-rls-check@invalid'"
          if [ "${count}" != "0" ]; then
            echo "::error::RLS did not hide users from runcodes_judge (saw ${count} rows)"
            exit 1
          fi

  migrations:
    name: Database (migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
        env:
          POSTGRES_USER: runcodes
          POSTGRES_PASSWORD: runcodes
          POSTGRES_DB: runcodes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcodes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: runcodes
      PGPASSWORD: runcodes
      # Disposable database Atlas uses to replay the migration directory. The
      # role must be `runcodes`: the schema file runs SET ROLE TO runcodes.
      ATLAS_DEV_URL: "postgres://runcodes:runcodes@localhost:5432/atlas_dev?sslmode=disable&search_path=public"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create the migration databases
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE atlas_dev'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE runcodes_migrated'

      # Checks atlas.sum and replays every file in the dev database.
      - name: Validate the migrations
        run: ./database/atlas.sh migrate validate --env local

      # `migrate diff` writes a file when the desired schema and the migration
      # directory disagree, so a clean tree means they are in sync.
      - name: Check the schema and migrations agree
        run: |
          ./database/atlas.sh migrate diff ci-check --env local
          if [ -n "$(git status --porcelain -- database/migrations)" ]; then
            echo "::error::database/schema/02-schema.sql changed without a migration"
            echo "Run ./database/atlas.sh migrate diff <name> and commit the result."
            git status --porcelain -- database/migrations
            git diff -- database/migrations
            exit 1
          fi

      - name: Apply the migrations to an empty database
        run: |
          ./database/atlas.sh migrate apply --env local \
            --url "postgres://runcodes:runcodes@localhost:5432/runcodes_migrated?sslmode=disable"

      # Proves the seed and the role setup still work on a database built only
      # from the migrations, not only on one built from the schema file.
      - name: Seed the migrated database and create the application role
        env:
          RUNCODES_DB_APP_PASSWORD: app-password
          RUNCODES_DB_JUDGE_PASSWORD: judge-password
        run: |
          psql -d runcodes_migrated -v ON_ERROR_STOP=1 -f database/schema/03-seed-data.sql
          PGDATABASE=runcodes_migrated ./database/schema/05-app-role.sh

      - name: Verify the application role on the migrated database
        env:
          PGDATABASE: runcodes_migrated
          PGUSER: runcodes_app
          PGPASSWORD: app-password
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "BEGIN;
                  INSERT INTO users (name, email, password_hash)
                       VALUES ('ci-migration-check', 'ci-migration-check@invalid', '!');
                  DELETE FROM users WHERE email = 'ci-migration-check@invalid';
                  ROLLBACK;"

          # The migration history is in its own schema and must stay outside the
          # application role's reach.
          if psql -tAc "SELECT count(*) FROM atlas_schema_revisions.atlas_schema_revisions" >/dev/null 2>&1; then
            echo "::error::runcodes_app can read the migration history"
            exit 1
          fi
