name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  judge:
    name: Judge (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judge
    env:
      # Without these the podman bindings need gpgme/btrfs development headers.
      TAGS: >-
        remote containers_image_openpgp exclude_graphdriver_btrfs
        exclude_graphdriver_overlay exclude_graphdriver_devicemapper
        exclude_graphdriver_zfs btrfs_noversion
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: judge/go.mod
          cache-dependency-path: judge/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -tags "$TAGS" ./...

      - name: Test
        # The end-to-end integration test skips itself unless JUDGE_TEST_DB_DSN
        # is set; see judge/integration/run.sh for the full harness.
        run: go test -count=1 -race -tags "$TAGS" ./...

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version that generated bun.lock.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  database:
    name: Database (schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: runcodes
          POSTGRES_PASSWORD: runcodes
          POSTGRES_DB: runcodes
        ports:
          - 5432:5432
        # Fail the job fast if the server never becomes ready.
        options: >-
          --health-cmd "pg_isready -U runcodes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema and seed
        env:
          PGPASSWORD: runcodes
        run: |
          for file in 01-init.sql 02-schema.sql 03-seed-data.sql; do
            echo "::group::$file"
            psql -h localhost -U runcodes -d runcodes -v ON_ERROR_STOP=1 \
              -f "database/schema/$file"
            echo "::endgroup::"
          done
