name: Trivy Scan Images

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Mondays at 03:00 UTC — catches new CVEs in the base images even
    # without code changes.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build & scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
          - service: database
            context: ./database
            # The database image upgrades Alpine packages at build time; the
            # per-run value keeps the build cache from serving a stale, still
            # vulnerable layer.
            build-args: |
              APK_CACHE_BUST=${{ github.run_id }}
          - service: judge
            context: ./judge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          # Load into the local docker daemon so Trivy can scan it.
          load: true
          tags: runcodes-${{ matrix.service }}:ci
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: runcodes-${{ matrix.service }}:ci
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          # Focus the image gate on the shipped artifact. `misconfig` is included
          # because trivy.yaml enables it: without it here, the only scan whose
          # findings can fail the pipeline would ignore Dockerfile and compose
          # misconfiguration entirely.
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # trivy.yaml sets exit-code: 1, so CRITICAL/HIGH findings fail this
          # step; the SARIF upload below still runs.
          cache-dir: /tmp/trivy-cache

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        # Uploads are not allowed for PRs from forks, so skip them there.
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  # The runner images are published by the release workflow, not built here, so
  # they are only scanned on the weekly schedule (new CVEs in their language
  # bases appear without a release). The release itself scans what it publishes
  # in runners.yml and fails on a finding.
  scan-published-runners:
    name: Scan published runner ${{ matrix.image }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the published package with the workflow token.
      packages: read
      # Required to upload SARIF results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The harness base every language image derives from, and the two that
        # moved to a new distribution base most recently.
        image: [base, python, zig]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the published image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}-runner-${{ matrix.image }}:latest
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-runner-${{ matrix.image }}.sarif
          cache-dir: /tmp/trivy-cache

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        if: always()
        with:
          sarif_file: trivy-runner-${{ matrix.image }}.sarif
          category: trivy-runner-${{ matrix.image }}
