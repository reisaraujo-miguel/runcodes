<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      /*
       * Critical theme background, applied before the bundle CSS loads (in
       * dev the CSS is injected by the JS bundle, which arrives later).
       * Keep the colors in sync with src/index.css theme variables.
       */
      html {
        color-scheme: light;
        background-color: oklch(1 0 0);
      }
      html.dark {
        color-scheme: dark;
        background-color: oklch(0.141 0.005 285.823);
      }
    </style>
    <script>
      // Apply the persisted/system theme before first paint to avoid a flash
      // of light mode. Keep in sync with src/lib/theme.ts.
      (function () {
        var theme = null;
        try {
          var stored = localStorage.getItem("theme-preference");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {
          // localStorage may be unavailable (e.g., in private browsing)
        }
        if (theme === null) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.remove("dark", "light");
        document.documentElement.classList.add(theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RunCodes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
