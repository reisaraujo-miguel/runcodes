# Single-host deployment built from published images.
#
# This stack is the image-based counterpart of the repository's root
# docker-compose.yml: it never builds from source. Point it at the registry,
# namespace and tags that hold the four application images and the runner
# images, then run ./deploy.sh.
#
# Required environment is documented in .env.example. The deploy script loads
# that file, prepares the execution directory and Podman socket, then pulls and
# starts the stack.
name: "${COMPOSE_PROJECT_NAME:-runcodes}"

services:
  # Caddy + the built SPA. The image is built by .github/workflows/app-images.yml.
  frontend:
    image: "${RUNCODES_IMAGE_REGISTRY:-ghcr.io}/${RUNCODES_IMAGE_NAMESPACE:-runcodes-icmc}/runcodes-frontend:${RUNCODES_IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
      - "${FRONTEND_HTTPS_PORT:-8444}:443"
    environment:
      TZ: "America/Sao_Paulo"
      RUNCODES_DOMAIN: "${RUNCODES_DOMAIN:-:80}"
      BACKEND_UPSTREAM: "http://backend:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - runcodes-network

  backend:
    image: "${RUNCODES_IMAGE_REGISTRY:-ghcr.io}/${RUNCODES_IMAGE_NAMESPACE:-runcodes-icmc}/runcodes-backend:${RUNCODES_IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8443}:8443"
    networks:
      - runcodes-network
    environment:
      TZ: "America/Sao_Paulo"
      RUNCODES_JWT_SECRET: "${RUNCODES_JWT_SECRET:?RUNCODES_JWT_SECRET must be set}"
      RUNCODES_API_PORT: "8443"
      RUNCODES_LEGACY_PASSWORD_SALT: "${RUNCODES_LEGACY_PASSWORD_SALT:-}"
      RUNCODES_DB_HOST: "database"
      RUNCODES_DB_PORT: "5432"
      RUNCODES_DB_USER: "runcodes_app"
      RUNCODES_DB_PASSWORD: "${RUNCODES_DB_APP_PASSWORD:?RUNCODES_DB_APP_PASSWORD must be set}"
      RUNCODES_DB_NAME: "runcodes"
      RUNCODES_JUDGE_URL: "http://judge:9000"
      RUNCODES_JUDGE_TOKEN: "${RUNCODES_JUDGE_TOKEN:?RUNCODES_JUDGE_TOKEN must be set}"
      RUNCODES_JUDGE_STALE_TIMEOUT: "${RUNCODES_JUDGE_STALE_TIMEOUT:-35m}"
      RUNCODES_JUDGE_MAX_QUEUE_DEPTH: "${RUNCODES_JUDGE_MAX_QUEUE_DEPTH:-100}"
      RUNCODES_S3_ENDPOINT: "http://seaweed:8333"
      RUNCODES_S3_REGION: "sa-east-1"
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
      RUNCODES_S3_BUCKET_PREFIX: "${RUNCODES_S3_BUCKET_PREFIX:-runcodes}"
      RUNCODES_REDIS_ADDR: "redis:6379"
      RUNCODES_REDIS_PASSWORD: "${RUNCODES_REDIS_PASSWORD:?RUNCODES_REDIS_PASSWORD must be set}"
      RUNCODES_PUBLIC_URL: "${RUNCODES_PUBLIC_URL:-http://localhost:8080}"
      RUNCODES_SMTP_HOST: "${RUNCODES_SMTP_HOST:-smtp4dev}"
      RUNCODES_SMTP_PORT: "${RUNCODES_SMTP_PORT:-25}"
      RUNCODES_SMTP_FROM: "${RUNCODES_SMTP_FROM:-RunCodes <no-reply@runcodes.local>}"
      RUNCODES_SMTP_USERNAME: "${RUNCODES_SMTP_USERNAME:-}"
      RUNCODES_SMTP_PASSWORD: "${RUNCODES_SMTP_PASSWORD:-}"
      RUNCODES_DEADLINE_REMINDERS: "${RUNCODES_DEADLINE_REMINDERS:-true}"
      RUNCODES_DEADLINE_REMINDER_INTERVAL: "${RUNCODES_DEADLINE_REMINDER_INTERVAL:-30m}"
    depends_on:
      database:
        condition: service_started
      smtp4dev:
        condition: service_started

  # Prepares the host execution directory before the judge starts. Podman
  # refuses to create a missing bind-mount source.
  judge-exec-init:
    image: alpine:3.24
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /exec && chmod 0777 /exec || true"]
    security_opt:
      - label=disable
    volumes:
      - "${RUNCODES_EXEC_DIR:?RUNCODES_EXEC_DIR must be set}:/exec"
    networks:
      - runcodes-network

  # Judge. It shares the host execution directory with the rootless Podman
  # service and pulls the language images from the configured registry.
  judge:
    image: "${RUNCODES_IMAGE_REGISTRY:-ghcr.io}/${RUNCODES_IMAGE_NAMESPACE:-runcodes-icmc}/runcodes-judge:${RUNCODES_IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JUDGE_PORT:-9000}:9000"
    user: "${JUDGE_UID:-0}:${JUDGE_GID:-0}"
    security_opt:
      - label=disable
    environment:
      TZ: "America/Sao_Paulo"
      JUDGE_ADDR: ":9000"
      JUDGE_CONCURRENCY: "${JUDGE_CONCURRENCY:-4}"
      JUDGE_PODMAN_URI: "unix:///run/podman/podman.sock"
      JUDGE_EXEC_DIR: "/exec"
      JUDGE_EXEC_DIR_REMOTE: "${RUNCODES_EXEC_DIR:?RUNCODES_EXEC_DIR must be set}"
      JUDGE_IMAGE_REGISTRY: "${RUNCODES_IMAGE_REGISTRY:-ghcr.io}"
      JUDGE_RUNNER_IMAGE_PREFIX: "${RUNCODES_RUNNER_IMAGE_PREFIX:-runcodes-icmc/runcodes-runner}"
      JUDGE_RUNNER_IMAGE_TAG: "${RUNCODES_RUNNER_IMAGE_TAG:-latest}"
      JUDGE_IMAGE_FORMAT: "${JUDGE_IMAGE_FORMAT:-}"
      JUDGE_CONTAINER_TMPFS_BYTES: "${JUDGE_CONTAINER_TMPFS_BYTES:-268435456}"
      JUDGE_AUTH_TOKEN: "${RUNCODES_JUDGE_TOKEN:?RUNCODES_JUDGE_TOKEN must be set}"
      JUDGE_MAX_RUN_DURATION: "${JUDGE_MAX_RUN_DURATION:-30m}"
      JUDGE_MAX_EXTRACT_ENTRIES: "${JUDGE_MAX_EXTRACT_ENTRIES:-1000}"
      JUDGE_MAX_WORKSPACE_BYTES: "${JUDGE_MAX_WORKSPACE_BYTES:-1073741824}"
      JUDGE_MAX_WORKSPACE_ENTRIES: "${JUDGE_MAX_WORKSPACE_ENTRIES:-50000}"
      RUNCODES_DB_HOST: "database"
      RUNCODES_DB_PORT: "5432"
      RUNCODES_DB_USER: "runcodes_judge"
      RUNCODES_DB_PASSWORD: "${RUNCODES_DB_JUDGE_PASSWORD:?RUNCODES_DB_JUDGE_PASSWORD must be set}"
      RUNCODES_DB_NAME: "runcodes"
      RUNCODES_S3_ENDPOINT: "http://seaweed:8333"
      RUNCODES_S3_REGION: "sa-east-1"
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
      RUNCODES_S3_BUCKET_PREFIX: "${RUNCODES_S3_BUCKET_PREFIX:-runcodes}"
    volumes:
      - "${RUNCODES_EXEC_DIR:?RUNCODES_EXEC_DIR must be set}:/exec"
      - "${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:/run/podman/podman.sock"
    networks:
      - runcodes-network
    depends_on:
      database:
        condition: service_started
      seaweed:
        condition: service_started
      judge-exec-init:
        condition: service_completed_successfully

  database:
    image: "${RUNCODES_IMAGE_REGISTRY:-ghcr.io}/${RUNCODES_IMAGE_NAMESPACE:-runcodes-icmc}/runcodes-database:${RUNCODES_IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    environment:
      TZ: "America/Sao_Paulo"
      POSTGRES_USER: runcodes
      POSTGRES_DB: runcodes
      POSTGRES_PASSWORD: "${RUNCODES_DB_PASSWORD:?RUNCODES_DB_PASSWORD must be set}"
      RUNCODES_DB_APP_PASSWORD: "${RUNCODES_DB_APP_PASSWORD:?RUNCODES_DB_APP_PASSWORD must be set}"
      RUNCODES_DB_JUDGE_PASSWORD: "${RUNCODES_DB_JUDGE_PASSWORD:?RUNCODES_DB_JUDGE_PASSWORD must be set}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - runcodes-db-vol:/var/lib/postgresql/
    networks:
      - runcodes-network

  # Local mail catcher. For a public deployment set RUNCODES_SMTP_HOST and
  # RUNCODES_SMTP_PORT to a real relay; this service is then unused.
  smtp4dev:
    image: rnwood/smtp4dev:v3.15
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP4DEV_WEB_PORT:-8081}:80"
      - "127.0.0.1:${SMTP4DEV_SMTP_PORT:-1025}:25"
    environment:
      TZ: "America/Sao_Paulo"
      ServerOptions__HostName: "smtp4dev"
    volumes:
      - smtp4dev-data:/smtp4dev
    networks:
      - runcodes-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${RUNCODES_REDIS_PASSWORD:?RUNCODES_REDIS_PASSWORD must be set}"
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - runcodes-redis-vol:/data
    networks:
      - runcodes-network

  seaweed-s3-init:
    image: alpine:3.24
    restart: "no"
    security_opt:
      - label=disable
    environment:
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
    volumes:
      - seaweed-s3-config:/config
      - ./seaweedfs-s3-init.sh:/init.sh:ro
    command:
      - /bin/sh
      - /init.sh

  seaweed:
    image: "chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.48}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEAWEED_S3_PORT:-8333}:8333"
    environment:
      TZ: "America/Sao_Paulo"
    command:
      - server
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=50
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -ip=seaweed
      - -ip.bind=0.0.0.0
    volumes:
      - runcodes-seaweed-vol:/data
      - seaweed-s3-config:/etc/seaweedfs
    depends_on:
      seaweed-s3-init:
        condition: service_completed_successfully
    networks:
      - runcodes-network

networks:
  runcodes-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  runcodes-db-vol:
  runcodes-redis-vol:
  runcodes-seaweed-vol:
  seaweed-s3-config:
  smtp4dev-data:
