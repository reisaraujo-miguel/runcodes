[defaults]
# The inventory is intentionally a local, untracked file: it contains the real
# addresses. Copy inventories/hosts.yml.example to inventories/hosts.yml.
inventory = ./inventories/hosts.yml

# Locally vendored collections/roles, so a deployment does not modify the
# controller's system-wide Ansible installation.
roles_path = ./roles:./.ansible-home/roles
collections_path = ./.ansible-home/collections

# Host keys must be provisioned before the first run; the setup guide documents
# the ssh-keyscan step and the out-of-band fingerprint check. Disabling this
# would let a man-in-the-middle receive vault-derived secrets.
host_key_checking = True

interpreter_python = auto_silent
deprecation_warnings = False
stdout_callback = default
callbacks_enabled = profile_tasks

[ssh_connection]
# Faster task execution. Disable this if a host runs an SSH daemon that does
# not support pipelining.
pipelining = True
