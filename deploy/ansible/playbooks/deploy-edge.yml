---
- name: Deploy the public edge and API
  hosts: edge
  become: false
  environment:
    HOME: "{{ runcodes_user_home | default(ansible_facts['user_dir']) }}"
    XDG_RUNTIME_DIR: "/run/user/{{ runcodes_uid | default(ansible_facts['user_uid']) }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ runcodes_uid | default(ansible_facts['user_uid']) }}/bus"
  roles:
    - role: rc-edge
