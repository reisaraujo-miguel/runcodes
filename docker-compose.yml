services:
  # Caddy: serves the SPA and reverse-proxies /api/* to the backend, so the API
  # is same-origin (no CORS, no build-time API URL). Point RUNCODES_DOMAIN at a
  # hostname and publish 80/443 for automatic HTTPS.
  frontend:
    build:
      context: ./frontend/
      args:
        # Same-origin: the SPA calls the relative /api path through Caddy.
        VITE_API_ENDPOINT: ""
        # Fallbacks for the login page. The contact values are stored in the
        # database (platform_settings) and edited by an admin in the admin panel;
        # these are only used until the API answers.
        VITE_CONTACT_DISCLAIMER_HTML: '${CONTACT_DISCLAIMER:-Em caso de eventuais problemas com a plataforma, entre em contato com <a href="mailto:contact@example.com">contact@example.com</a>}'
        VITE_CONTACT_EMAIL: "${CONTACT_EMAIL:-contact@example.com}"
    restart: unless-stopped
    ports:
      # Override for a public deployment: FRONTEND_HTTP_PORT=80 FRONTEND_HTTPS_PORT=443.
      # The default HTTPS host port avoids 8443, which the backend already
      # publishes on loopback.
      - "${FRONTEND_HTTP_PORT:-8080}:80"
      - "${FRONTEND_HTTPS_PORT:-8444}:443"
    environment:
      TZ: "America/Sao_Paulo"
      # ":80" for local HTTP; a hostname (e.g. example.com) enables automatic HTTPS.
      RUNCODES_DOMAIN: "${RUNCODES_DOMAIN:-:80}"
      BACKEND_UPSTREAM: "http://backend:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - runcodes-network

  backend:
    build: ./backend/
    restart: unless-stopped
    ports:
      # Host-local only: the API is served through the Caddy proxy. Loopback
      # keeps it reachable for local frontend development (`bun run dev`).
      - "127.0.0.1:8443:8443"
    networks:
      - runcodes-network
    environment:
      TZ: "America/Sao_Paulo"
      RUNCODES_JWT_SECRET: "${RUNCODES_JWT_SECRET:?RUNCODES_JWT_SECRET must be set}"
      RUNCODES_API_PORT: "8443"
      RUNCODES_LEGACY_PASSWORD_SALT: "${RUNCODES_LEGACY_PASSWORD_SALT:-}"
      RUNCODES_DB_HOST: "database"
      RUNCODES_DB_PORT: "5432"
      # The application role, not the database owner: it can read and write rows
      # and nothing else (database/schema/05-app-role.sh).
      RUNCODES_DB_USER: "runcodes_app"
      RUNCODES_DB_PASSWORD: "${RUNCODES_DB_APP_PASSWORD:?RUNCODES_DB_APP_PASSWORD must be set}"
      RUNCODES_DB_NAME: "runcodes"
      RUNCODES_JUDGE_URL: "http://judge:9000"
      RUNCODES_JUDGE_TOKEN: "${RUNCODES_JUDGE_TOKEN:?RUNCODES_JUDGE_TOKEN must be set}"
      RUNCODES_S3_ENDPOINT: "http://seaweed:8333"
      RUNCODES_S3_REGION: "sa-east-1"
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
      RUNCODES_S3_BUCKET_PREFIX: "runcodes"
      RUNCODES_REDIS_ADDR: "redis:6379"
      RUNCODES_REDIS_PASSWORD: "${RUNCODES_REDIS_PASSWORD:?RUNCODES_REDIS_PASSWORD must be set}"
      # Browser-facing origin used in the links inside outgoing email. This is
      # the Caddy frontend by default; a public deployment sets its hostname.
      RUNCODES_PUBLIC_URL: "${RUNCODES_PUBLIC_URL:-http://localhost:8080}"
      # Account verification mail goes to the bundled catcher. Its web UI is at
      # http://localhost:8081, and its SMTP port is published on 127.0.0.1:1025
      # for running the backend outside Compose (`cd backend && go run .`).
      RUNCODES_SMTP_HOST: "smtp4dev"
      RUNCODES_SMTP_PORT: "25"
      RUNCODES_SMTP_FROM: "${RUNCODES_SMTP_FROM:-RunCodes <no-reply@runcodes.local>}"
      RUNCODES_SMTP_USERNAME: "${RUNCODES_SMTP_USERNAME:-}"
      RUNCODES_SMTP_PASSWORD: "${RUNCODES_SMTP_PASSWORD:-}"
    depends_on:
      database:
        condition: service_started
      smtp4dev:
        condition: service_started

  # Prepares the host's ./exec directory before the judge starts. The directory
  # is tracked in the repository (exec/.gitkeep) because podman, unlike Docker,
  # refuses to create a missing bind-mount source: without it, container
  # creation fails with "crun: cannot stat .../exec: No such file or directory".
  # This one-shot then makes it writable by the judge (UID 1000) so it can create
  # its per-commit workspaces, without any manual host setup.
  judge-exec-init:
    image: alpine:3.24
    user: "0:0"
    restart: "no"
    # Best effort: if the chmod is denied (an unusual userns mapping), the judge
    # still starts, since the directory is owned by the judge's UID. It must not
    # fail the `service_completed_successfully` gate below.
    command: ["sh", "-c", "mkdir -p /exec && chmod 0777 /exec || true"]
    # Without this SELinux (enforcing on Fedora) denies the chmod on the
    # user_home_t bind mount, and the `|| true` hides it: the judge then finds a
    # 0755 directory it cannot write to.
    security_opt:
      - label=disable
    volumes:
      - ./exec:/exec
    networks:
      - runcodes-network

  # Judge (execution engine). Runs the language images with rootless podman.
  # It shares the host's exec directory with the podman service, so
  # JUDGE_EXEC_DIR_REMOTE must be the *host* absolute path of ./exec.
  judge:
    build: ./judge/
    restart: unless-stopped
    ports:
      # Loopback only. The backend reaches the judge over the compose network, so
      # nothing needs this published: the judge runs untrusted code and its API is
      # guarded by a single shared token.
      - "127.0.0.1:9000:9000"
    # Rootless podman maps container root to the host user, so the judge runs as
    # root *inside* the container. A container uid of 1000 would map to a host
    # subuid (524288+), which can neither open the socket below (0660, owned by
    # the host user) nor write the workspaces the host's podman mounts into the
    # runner containers. Under Docker rootful this is plain container root, which
    # reaches the socket as well.
    user: "${JUDGE_UID:-0}:${JUDGE_GID:-0}"
    # SELinux (enforcing on Fedora) labels the rootless socket user_tmp_t, which
    # container_t cannot connect to: the mount is alive but every connect fails
    # with EACCES ("connect: permission denied"). Relabelling the live socket
    # would be undone the next time systemd recreates it, so drop SELinux
    # separation for this container alone. Untrusted code runs in the runner
    # containers, which stay confined.
    security_opt:
      - label=disable
    environment:
      TZ: "America/Sao_Paulo"
      JUDGE_ADDR: ":9000"
      JUDGE_CONCURRENCY: "4"
      JUDGE_PODMAN_URI: "unix:///run/podman/podman.sock"
      JUDGE_EXEC_DIR: "/exec"
      JUDGE_EXEC_DIR_REMOTE: "${PWD}/exec"
      JUDGE_CONTAINER_TMPFS_BYTES: "${JUDGE_CONTAINER_TMPFS_BYTES:-268435456}"
      # Required: without it the judge refuses every /v1 request, because the API
      # serves other people's submissions and outputs.
      JUDGE_AUTH_TOKEN: "${RUNCODES_JUDGE_TOKEN:?RUNCODES_JUDGE_TOKEN must be set}"
      RUNCODES_DB_HOST: "database"
      RUNCODES_DB_PORT: "5432"
      # The judge role, not the backend role: it can only read exercises/test
      # cases and claim/update commits (database/schema/05-app-role.sh).
      RUNCODES_DB_USER: "runcodes_judge"
      RUNCODES_DB_PASSWORD: "${RUNCODES_DB_JUDGE_PASSWORD:?RUNCODES_DB_JUDGE_PASSWORD must be set}"
      RUNCODES_DB_NAME: "runcodes"
      RUNCODES_S3_ENDPOINT: "http://seaweed:8333"
      RUNCODES_S3_REGION: "sa-east-1"
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
      RUNCODES_S3_BUCKET_PREFIX: "runcodes"
    volumes:
      - ./exec:/exec
      # Rootless podman API socket. Override PODMAN_SOCKET when UID != 1000.
      - "${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock"
    networks:
      - runcodes-network
    depends_on:
      database:
        condition: service_started
      seaweed:
        condition: service_started
      # The shared exec directory must exist and be writable before the judge
      # can create its workspaces (see judge-exec-init above).
      judge-exec-init:
        condition: service_completed_successfully

  # PostgreSQL Database
  database:
    build: ./database/
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: "America/Sao_Paulo"
      POSTGRES_USER: runcodes
      POSTGRES_DB: runcodes
      POSTGRES_PASSWORD: "${RUNCODES_DB_PASSWORD:?RUNCODES_DB_PASSWORD must be set}"
      # Only read by 05-app-role.sh, which creates the roles the services use.
      RUNCODES_DB_APP_PASSWORD: "${RUNCODES_DB_APP_PASSWORD:?RUNCODES_DB_APP_PASSWORD must be set}"
      RUNCODES_DB_JUDGE_PASSWORD: "${RUNCODES_DB_JUDGE_PASSWORD:?RUNCODES_DB_JUDGE_PASSWORD must be set}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - runcodes-db-vol:/var/lib/postgresql/
    networks:
      - runcodes-network

  # Local mail catcher. It accepts any recipient and keeps the messages for
  # inspection, so account verification can be tested end to end without a real
  # mail server. The web UI is at http://localhost:8081.
  smtp4dev:
    image: rnwood/smtp4dev:v3.15
    restart: unless-stopped
    ports:
      # Loopback only: the mail catcher has no authentication and keeps every
      # message the platform has sent.
      - "127.0.0.1:8081:80" # web UI
      - "127.0.0.1:1025:25" # SMTP, for a backend running outside Compose
    environment:
      TZ: "America/Sao_Paulo"
      ServerOptions__HostName: "smtp4dev"
    volumes:
      # Keep captured messages across restarts.
      - smtp4dev-data:/smtp4dev
    networks:
      - runcodes-network

  # Redis for cache & session management
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # The cache holds no auth data, but an unauthenticated Redis on the shared
    # bridge lets any container poison or clear the platform cache.
    command:
      - redis-server
      - --requirepass
      - "${RUNCODES_REDIS_PASSWORD:?RUNCODES_REDIS_PASSWORD must be set}"
    environment:
      TZ: "America/Sao_Paulo"
    volumes:
      - runcodes-redis-vol:/data
    networks:
      - runcodes-network

  ###########
  # Seaweed #
  ###########

  # SeaweedFS only authenticates S3 requests when a config file is supplied.
  # Generate it from the same credentials the backend and judge use, so the
  # gateway is not left open to every container on the bridge.
  seaweed-s3-init:
    image: alpine:3.24
    restart: "no"
    environment:
      RUNCODES_S3_CREDENTIALS_KEY: "${RUNCODES_S3_CREDENTIALS_KEY:?RUNCODES_S3_CREDENTIALS_KEY must be set}"
      RUNCODES_S3_CREDENTIALS_SECRET: "${RUNCODES_S3_CREDENTIALS_SECRET:?RUNCODES_S3_CREDENTIALS_SECRET must be set}"
    volumes:
      - seaweed-s3-config:/config
      - ./deploy/compose/seaweedfs-s3-init.sh:/init.sh:ro
    command:
      - /bin/sh
      - /init.sh

  seaweed:
    image: chrislusf/seaweedfs:4.48
    ports:
      # Loopback only: the S3 gateway holds every submission and expected output,
      # so reaching it directly must not be possible from the network.
      - "127.0.0.1:8333:8333"
    environment:
      TZ: "America/Sao_Paulo"
    command:
      - server
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=50
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -ip=seaweed
      - -ip.bind=0.0.0.0
    volumes:
      - runcodes-seaweed-vol:/data
      - seaweed-s3-config:/etc/seaweedfs
    depends_on:
      seaweed-s3-init:
        condition: service_completed_successfully
    networks:
      - runcodes-network

networks:
  runcodes-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  runcodes-db-vol:
  runcodes-redis-vol:
  runcodes-seaweed-vol:
  seaweed-s3-config:
  smtp4dev-data:
